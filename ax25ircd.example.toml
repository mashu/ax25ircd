# ax25ircd example configuration.
#
# Copy to ax25ircd.toml and edit. Check it with:  ax25ircd --check -c ax25ircd.toml
#
# READ docs/regulatory.md BEFORE ENABLING THE RADIO SECTION. Running this
# server with radio.enabled = true makes your station transmit automatically,
# under your licence, carrying other people's traffic.

[server]
name = "ax25irc.sk0mt.example"
network = "AX25IRC"
motd = [
  "SK0MT packet gateway, 144.800 MHz, 1200 baud AFSK",
  "Channels marked +r are transmitted on the air in the clear.",
  "Identify with: /quote CALLSIGN SM0ABC",
  "Keep a nick: /quote REGISTER <password>  then  IDENTIFY <password>",
  "Air: a control operator must RADIO GRANT your registered nick. CALLSIGN is also required.",
]
max_nick_len = 30
max_channels_per_user = 20
# password = "optional connection password"

[listen]
# Bind to localhost and put a TLS terminator (or an SSH tunnel) in front of it
# if you expose this to the Internet. TLS protects the IP hop only: everything
# that reaches the air is, and must be, in the clear.
bind = ["127.0.0.1:6667"]
ping_interval_secs = 120
registration_timeout_secs = 60
max_conns_per_host = 8

[logging]
# Extra copy of tracing output. stderr/journald still get the same lines.
# file = "ax25ircd.log"
# Who connected, claimed a callsign, flooded, kicked, and what went on the air.
# audit_file = "audit.log"

[accounts]
# Argon2id hashes of nick passwords. Created on first REGISTER.
file = "nicks.json"
identify_timeout_secs = 60
min_password_len = 8

[radio]
enabled = false

# The station that transmits. This callsign is what appears in every AX.25
# source address and in the periodic identification.
callsign = "SK0MT-1"

# AX.25 destination address used for broadcast (channel) traffic. Acts as a
# protocol marker so others on frequency can filter AIRC out.
destination = "AIRC"

# Digipeater path. Empty is best. Two hops is the maximum this server allows.
path = []

# Identification interval in seconds. Must be <= 600.
id_interval_secs = 540
id_text = "AX25IRC gateway - IRC over packet"

# AX.25 information field limit. 128 gets through a noisy channel far more
# often than the 256 byte default.
paclen = 128

ack_timeout_secs = 12
max_retries = 3
peer_idle_timeout_secs = 1800

# Send join/part notices over the air. Off by default: on a busy channel this
# is most of your airtime for very little information.
presence_notices = false

# Hold private messages for stations that are out of range and deliver them
# when the station is next heard. Bounded and expiring by design.
mailbox_enabled = true
mailbox_per_station = 10
mailbox_total = 200
mailbox_ttl_secs = 86400

# Repeat RF-originated messages back onto RF for stations that are hidden from
# each other. Doubles the airtime cost of every message.
repeat_rf_traffic = false

# NOTICE the sender when a channel message is actually put on the air.
notice_air_relay = true

[radio.tnc]
# "tcp" (Direwolf, ax25-tools KISS-over-TCP), "serial" (needs --features
# serial), or "loopback" for a dry run that transmits nothing.
kind = "tcp"
host = "127.0.0.1"
port = 8001
# device = "/dev/ttyUSB0"
# baud = 9600
kiss_port = 0

# Minimum gap between transmissions. At 1200 baud a 128 byte frame is about
# one second of airtime, so leave room for everyone else.
tx_pacing_ms = 1500

# Optional KISS parameters pushed to the TNC at connect.
# txdelay = 30
# persistence = 63
# slottime = 10

# ---------------------------------------------------------------------------
# Transmitter airtime governor.
#
# This is not a fairness knob — [policy] below is. This one protects the
# hardware and the band. Every frame is costed in seconds of key-down time
# (txdelay + data + txtail) before it is transmitted, and three independent
# limits apply: a duty cycle over a sliding window, a maximum unbroken run
# followed by a forced cooldown, and a hard airtime ceiling per rolling hour.
#
# It matters most on QRP HF. A QMX-class radio has finals with no thermal
# headroom, and at 300 baud a single 128-octet frame is roughly four seconds
# of continuous carrier — a handful of queued messages is already a minute
# of transmitting. The defaults below assume exactly that setup.
#
# For 1200 baud VHF FM with a radio that has a heatsink, `baud = 1200` and
# something like max_duty_percent = 40 is reasonable.
#
# `RADIO DUTY` shows the live figures. Frames the governor has held longer
# than max_hold_secs are dropped: a two-minute-old chat line is not worth
# the airtime it would cost.
[radio.duty]
enabled = true
baud = 300
# Match these to the TNC's TXDELAY/TXTAIL: they are real key-down time.
txdelay_ms = 400
txtail_ms = 300
window_secs = 600
max_duty_percent = 25
max_continuous_secs = 30
cooldown_secs = 60
# 0 disables the hourly ceiling.
hourly_airtime_secs = 900
max_hold_secs = 120

[policy]
max_rf_text_len = 160
rf_msgs_per_min = 6
rf_burst = 4
ip_to_rf_msgs_per_min = 10
rf_channel_msgs_per_min = 10
rf_channel_burst = 4
ip_cmds_per_min = 90
ip_cmd_burst = 30
block_apparent_ciphertext = true
identify_per_min = 6
identify_burst = 3
# An IP user's messages are radiated only after:
#   1. REGISTER + IDENTIFY (the nick is stored in accounts.file)
#   2. RADIO GRANT <nick> by a control operator (persisted on that account)
#   3. CALLSIGN <call> (legal third-party identification; restored on IDENTIFY)
# OPER always has RF-TX. RF stations on the air are not IRC accounts.
deny_callsigns = []
allow_callsigns = []   # empty means any amateur callsign may use the RF side

[[channels]]
name = "#rf"
topic = "Bridged to 144.800 MHz - everything here is transmitted"
rf = true
operators = ["sm0abc"]

[[channels]]
name = "#local"
topic = "Internet only, nothing here goes on the air"
rf = false

[[opers]]
name = "sm0abc"
password = "change-me"
